# WordNest 一键部署（Docker Desktop）
# 常用命令：
#   启动/重建：docker compose up -d --build
#   查看日志：  docker compose logs -f
#   停止：      docker compose down
# 浏览器打开：http://localhost:5000
services:
  wordnest:
    build:
      context: .
      args:
        # 国内镜像源；海外可改成 https://deb.debian.org / https://pypi.org/simple
        APT_MIRROR: ${APT_MIRROR:-https://mirrors.aliyun.com}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    image: wordnest:local
    container_name: wordnest
    restart: unless-stopped
    ports:
      - "${WORDNEST_PORT:-5000}:5000"
    environment:
      # 生产配置（关闭 debug，避免 gunicorn 下的 reloader 问题）
      FLASK_ENV: production
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-wordnest-local-secret-please-change}
      # AI 功能：例句 / 记忆法 / 知识图谱
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # 注意：不要写成带空格的 'https://api.deepseek.com  '，否则 requests 会解析失败
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      # 例句/笔记优先复用词库单词：每次抽样多少个词喂给模型（0 = 关闭该功能）
      WORD_BANK_LIMIT: ${WORD_BANK_LIMIT:-40}
      # 访问密码：留空=不启用；手机/公网访问时建议设置（设置后所有页面需先登录）
      WORDNEST_PASSWORD: ${WORDNEST_PASSWORD:-}
      # 容器出网代理：宿主机开了 Clash 等代理时必须走这个端口，否则容器直连会被掐断。
      # 代理没开时会自动回落直连，所以默认填上也没坏处。
      WORDNEST_PROXY: ${WORDNEST_PROXY:-http://host.docker.internal:7897}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # 词库数据库（每个单词列表一个 .db 文件）
      - ./instance:/app/instance
      # AI 助教聊天记录
      - ./chat_data:/app/chat_data
      # 每日学习记录（按天统计，独立于词库）
      - ./study_data:/app/study_data
      # 界面偏好设置（需要在宿主机上先存在该文件，否则 Docker 会创建成目录）
      - ./settings.json:/app/settings.json
    extra_hosts:
      # 方便以后从容器里访问宿主机上的 Ollama / 本地模型服务
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
